name: Run Worker Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-worker:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Build Docker image from worker/Dockerfile
      - name: Build Worker Docker Image
        run: |
          docker build -t my-worker:latest ./worker

      # 4. Run docker-compose if needed
      - name: Run Docker Compose
        run: |
          docker-compose -f compose.yaml up -d

      # 5. Run the worker container
      - name: Run Worker Container
        run: |
          docker run --rm my-worker:latest

      # 6. Tear down docker-compose services (cleanup)
      - name: Stop Docker Compose
        if: always()
        run: |
          docker-compose -f compose.yaml down
