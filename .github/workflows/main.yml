name: Build and Run Worker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docker-worker:
    runs-on: ubuntu-24.04

    steps:
      # 1. Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx (for advanced builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Ensure docker compose CLI is available
      - name: Install Docker Compose CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose-plugin

      # 4. Build and run worker service
      - name: Build and run worker
        run: |
          # Navigate to repo root
          cd $GITHUB_WORKSPACE

          # Build docker image if needed
          docker compose -f worker/compose.yml build

          # Start services in detached mode
          docker compose -f worker/compose.yml up -d

      # Optional: list running containers
      - name: List running containers
        run: docker ps
