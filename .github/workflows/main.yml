name: Run Worker Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Run Worker via Compose
        run: |
          docker compose -f worker/compose.yaml build
          docker compose -f worker/compose.yaml up -d

      - name: Execute commands inside worker
        run: |
          docker compose -f worker/compose.yaml exec -T worker echo "Worker is running"

      - name: Stop and remove containers
        if: always()
        run: |
          docker compose -f worker/compose.yaml down
